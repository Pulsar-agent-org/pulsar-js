name: Bug report
description: Report incorrect behavior in one of the packages
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use private reporting as
        described in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal snippet or commands, and the package version.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Package
      options:
        - "core"
        - "server"
        - "client"
        - "mcp"
        - "docs"
        - "examples"
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This is not a security vulnerability. Security issues go to SECURITY.md.
          required: true
