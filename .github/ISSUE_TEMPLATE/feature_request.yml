name: Feature request
description: Propose new work in one of the packages
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and context
      description: What is missing or hard today, and why it matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you propose to build, and the files it likely touches.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >
        How a reviewer will know it is done. A change to replay protection, spend
        caps, or verification must ship a test for the failure case, not only the
        success case.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Package
      options:
        - "core"
        - "server"
        - "client"
        - "mcp"
        - "docs"
        - "examples"
    validations:
      required: true
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      options:
        - "good first issue"
        - "intermediate"
        - "advanced"
    validations:
      required: false
